# ═══════════════════════════════════════════════════════════════════════════════
# ZEAL — Continuous Integration
# ─────────────────────────────────────────────────────────────────────────────
# Runs on every push + PR to main:
#   1. Grep gate  → blocks any Prisma reference in live paths
#   2. Type check → both apps (web + admin)
#   3. Build      → both apps (catches missing dependencies)
#   4. Lint       → soft-warn (does not block)
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prisma-guard:
    name: Prisma Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if prisma.* used in live request paths
        run: |
          HITS=$(grep -rn "prisma\." \
            apps/web/app/api \
            apps/web/lib \
            apps/admin/app/api \
            2>/dev/null | grep -v "_archive" | grep -v ".d.ts" || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Prisma references found in live paths:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ Zero prisma.* in live paths"

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check ${{ matrix.workspace }}
        run: npm run type-check --workspace=${{ matrix.workspace }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check]
    strategy:
      matrix:
        workspace: [web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build ${{ matrix.workspace }}
        run: npm run build --workspace=${{ matrix.workspace }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "build-dummy-key"
          SUPABASE_SERVICE_ROLE_KEY: "build-dummy-service-key"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_ADMIN_URL: "http://localhost:3001"
          GROQ_API_KEY: "gsk_build_dummy"

  lint:
    name: Lint (soft)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint web
        run: npm run lint --workspace=web
        continue-on-error: true

      - name: Lint admin
        run: npm run lint --workspace=admin
        continue-on-error: true
